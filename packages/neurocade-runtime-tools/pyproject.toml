[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocade-runtime-tools"
version = "0.1.0"
description = "Local NeuroCade Docker runtime request helpers"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
neurocade_runtime_tools = [
  "prebuilt_indexes/*/*.json",
  "prebuilt_indexes/*/*.jsonl",
]
