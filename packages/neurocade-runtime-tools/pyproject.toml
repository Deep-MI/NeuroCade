[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neurocade-runtime-tools"
version = "0.2.0"
description = "NeuroCade host-native Docker and Apptainer runtime bridge"
requires-python = ">=3.12,<3.13"
dependencies = ["requests>=2.31,<3"]

[project.scripts]
neurocade-runtime-bridge = "neurocade_runtime_tools.bridge_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
