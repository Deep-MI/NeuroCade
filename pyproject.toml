[project]
name = "neurocade"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "starlette==1.3.1",
  "uvicorn[standard]==0.31.0",
  "sqlalchemy==2.0.36",
  "alembic==1.14.0",
  "pydantic-settings==2.6.1",
  "PyJWT[crypto]==2.13.0",
  "langchain-openai==1.1.14",
  "langchain-anthropic>=1.2,<2",
  "langchain-google-genai>=4.0,<5",
  "langchain-ollama>=1.1,<2",
  "python-multipart==0.0.32",
  "python-dotenv==1.2.2",
  "PyYAML==6.0.3",
  "nibabel==5.2.1",
  "numpy==1.26.4",
  "requests>=2.31,<3",
  "tqdm>=4.67,<5",
  "neurocade-runtime-tools",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "requests>=2.31",
  "httpx2>=2.9,<3",
  "playwright>=1.40",
  "pyright>=1.1.409",
  "ruff==0.16.0",
]

[tool.uv.sources]
neurocade-runtime-tools = { path = "packages/neurocade-runtime-tools", editable = true }

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# FastAPI intentionally calls Depends/File in parameter defaults. UP042 and
# UP047 can change runtime enum or typing behavior and need dedicated reviews.
ignore = ["B008", "E501", "UP042", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Tests adjust sys.path before importing application modules.
"tests/**/*.py" = ["E402"]

[tool.pyright]
include = [
  "backend_common",
  "api-service/api_service",
  "packages/neurocade-runtime-tools/src",
  "tests",
  "scripts",
  "migrations",
]
exclude = [
  "**/__pycache__",
  ".venv",
  "client",
  "fastsurfer-data",
  "neurocade-data",
]
extraPaths = [
  ".",
  "api-service",
  "packages/neurocade-runtime-tools/src",
]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."
