name: neurocade

# Single-process monolith (see MONOLITH_REFACTOR_PLAN.md). One `app` service
# serves the API + built SPA, runs background jobs in-process, and launches
# tools via Apptainer. Postgres, Redis, Celery, the runtime-runner sidecar and
# the nginx gateway are all gone.
#
# Compose isn't required to run a single container (see scripts/run_container.sh
# for a plain `docker run`); it is kept as the lifecycle entry point the
# installer/admin scripts use (detached run, restart policy, logs, status).
#
# Apptainer-in-container needs an elevated container (Neurodesk precedent): the
# service runs `privileged` with /dev/fuse. Prefer the native install for hosts
# that cannot grant that.

services:
  app:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: neurocade:local
    environment:
      DEPLOYMENT_PROFILE: ${DEPLOYMENT_PROFILE:-local}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8000}
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-localhost,127.0.0.1}
      HOST_DATA_DIR: /data
      NEUROCADE_CONFIG_DIR: /app/config
      # Native installs write host SQLite paths to DATABASE_URL. Containers must
      # use the mounted data path unless an explicit container URL is supplied.
      DATABASE_URL: ${NEUROCADE_CONTAINER_DATABASE_URL:-sqlite+pysqlite:////data/neurocade.db}
      NEUROCADE_RUNTIME_BACKEND: ${NEUROCADE_RUNTIME_BACKEND:-apptainer}
      NEUROCADE_SIF_DIR: /data/sif
      APPTAINER_CACHEDIR: ${APPTAINER_CACHEDIR:-/data/apptainer-cache}
      TOOL_CATALOG_DIR: /app/llm-data/tool-catalog
      NEUROCADE_CONTAINER_INVENTORY: /app/llm-data/tool-catalog/installed_containers.json
      NEUROCADE_INSTALLED_TOOLS_JSONL: /app/llm-data/tool-catalog/installed_tools.jsonl
      LOCAL_AUTH_ENABLED: ${LOCAL_AUTH_ENABLED:-true}
      VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
      VITE_CLERK_JWT_TEMPLATE: ${VITE_CLERK_JWT_TEMPLATE:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_ISSUER: ${CLERK_ISSUER:-}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-}
      FREESURFER_LICENSE: ${FREESURFER_LICENSE:-}
      FASTSURFER_DEVICE_MODE: ${FASTSURFER_DEVICE_MODE:-auto}
      LLM_API_TOKEN: ${LLM_API_TOKEN:-CHANGE_ME}
      LLM_PROVIDER_DEFAULT: ${LLM_PROVIDER_DEFAULT:-openai-compatible}
      WORKFLOW_DEFAULT_PROVIDER: ${WORKFLOW_DEFAULT_PROVIDER:-openai-compatible}
      LLM_NATIVE_TOOL_CALLING: ${LLM_NATIVE_TOOL_CALLING:-false}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      LLM_BACKEND_URL: ${LLM_BACKEND_URL:-}
      LLM_BACKEND_API_KEY: ${LLM_BACKEND_API_KEY:-}
      LLM_BACKEND_MODEL: ${LLM_BACKEND_MODEL:-Qwen/Qwen3.6-35B-A3B}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_MODEL: ${GOOGLE_MODEL:-}
      MONITORING_ADMIN_USER_IDS: ${MONITORING_ADMIN_USER_IDS:-demo-user}
      DICOM_RAW_RETENTION: ${DICOM_RAW_RETENTION:-discard}
      DICOM_CONVERSION_TIMEOUT_SECONDS: ${DICOM_CONVERSION_TIMEOUT_SECONDS:-300}
      MAX_UPLOAD_FILE_SIZE_BYTES: ${MAX_UPLOAD_FILE_SIZE_BYTES:-2147483648}
      DICOM_ZIP_MAX_ENTRIES: ${DICOM_ZIP_MAX_ENTRIES:-5000}
      DICOM_ZIP_MAX_EXPANDED_BYTES: ${DICOM_ZIP_MAX_EXPANDED_BYTES:-4294967296}
    volumes:
      - ${NEUROCADE_HOST_DATA_DIR:-./neurocade-data}:/data
      - ./llm-data/tool-catalog:/app/llm-data/tool-catalog
    ports:
      - "${APP_HTTP_BIND:-127.0.0.1}:${APP_HTTP_PORT:-8000}:8000"
    restart: unless-stopped
    # Required to run Apptainer inside the container (rootless SIF execution).
    privileged: true
    devices:
      - /dev/fuse
    extra_hosts:
      - host.docker.internal:host-gateway
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/app/healthz', timeout=2).read()"]
      interval: 10s
      timeout: 5s
      retries: 30
