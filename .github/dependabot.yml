version: 2

multi-ecosystem-groups:
  monthly-dependencies:
    schedule:
      interval: "monthly"
      time: "08:00"
      timezone: "Europe/Berlin"
    labels:
      - "dependencies"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    patterns:
      - "*"
    multi-ecosystem-group: "monthly-dependencies"
    labels:
      - "dependencies"
      - "github-actions"

  - package-ecosystem: "npm"
    directory: "/client"
    patterns:
      - "*"
    multi-ecosystem-group: "monthly-dependencies"
    labels:
      - "dependencies"
      - "frontend"

  - package-ecosystem: "pip"
    directory: "/api-service"
    patterns:
      - "*"
    multi-ecosystem-group: "monthly-dependencies"
    labels:
      - "dependencies"
      - "backend"

  - package-ecosystem: "pip"
    directory: "/tests"
    patterns:
      - "*"
    multi-ecosystem-group: "monthly-dependencies"
    labels:
      - "dependencies"
      - "tests"
