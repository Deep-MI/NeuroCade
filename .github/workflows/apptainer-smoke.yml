name: Apptainer hosted runner smoke test

on:
  workflow_dispatch:
    inputs:
      build_bash_python:
        description: "Also build the bash Python SIF artifact."
        required: false
        default: false
        type: boolean
      bash_python_mksquashfs_args:
        description: "Optional mksquashfs args for the bash Python SIF, for example '-comp xz'."
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  apptainer-smoke:
    name: Verify hosted Apptainer SIF support
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Apptainer
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Smoke-test Apptainer pull and exec
        run: |
          set -euxo pipefail
          export APPTAINER_CACHEDIR="$RUNNER_TEMP/apptainer-cache"
          export APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer-tmp"
          mkdir -p "$APPTAINER_CACHEDIR" "$APPTAINER_TMPDIR" dist/apptainer-smoke
          apptainer pull --force dist/apptainer-smoke/alpine.sif docker://alpine:latest
          apptainer exec dist/apptainer-smoke/alpine.sif echo ok
          ./scripts/apptainer/images.sh preflight

      - name: Build bash Python SIF
        if: inputs.build_bash_python == true
        env:
          RELEASE_ARTIFACT_DIR: dist/apptainer-smoke
          RELEASE_VERSION: smoke
          APPTAINER_USE_SUDO: "true"
          SKIP_CONTAINER_ARTIFACTS: "false"
          SKIP_SAMPLE_CASE_ARTIFACT: "true"
          BASH_PYTHON_MKSQUASHFS_ARGS: ${{ inputs.bash_python_mksquashfs_args }}
        run: |
          export APPTAINER_CACHEDIR="$RUNNER_TEMP/apptainer-cache"
          export APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer-tmp"
          ./scripts/release/build_artifacts.sh
          apptainer exec dist/apptainer-smoke/bash-image-python-3.12.sif python3.12 - <<'PY'
          import importlib.metadata
          import ants
          import bids
          import dipy
          import fireants
          import h5py
          import hydra
          import lapy
          import matplotlib
          import mne
          import nibabel
          import nilearn
          import neuroreg
          import nipype
          import nitransforms
          import numpy
          import pandas
          import pydicom
          import scipy
          import skimage
          import sklearn
          import SimpleITK
          import surfa
          import templateflow
          importlib.metadata.version("whippersnappy")
          print("neuroimaging imports ok")
          PY
          ls -lh dist/apptainer-smoke

      - name: Upload smoke artifacts
        if: inputs.build_bash_python == true
        uses: actions/upload-artifact@v6
        with:
          name: apptainer-smoke-artifacts
          path: dist/apptainer-smoke/*
