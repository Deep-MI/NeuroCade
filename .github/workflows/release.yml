name: Release

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      release_kind:
        description: "Release kind to publish."
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable
      target_ref:
        description: "Branch, tag, or commit SHA to release for manual runs."
        required: true
        default: main
        type: string
      date:
        description: "Release date. Defaults to today's UTC date."
        required: false
        type: string
      correction:
        description: "Stable only: optional correction number. Leave blank to use vYYYY.M.D or the next available correction."
        required: false
        type: string
      sample_case_artifact_url:
        description: "URL to a prebuilt neurocade-sample-case-FastSurfer_Rhineland_0000.tar.gz. Defaults to RELEASE_SAMPLE_CASE_ARTIFACT_URL repository variable."
        required: false
        type: string
      sample_case_artifact_sha256:
        description: "Optional SHA256 for the prebuilt sample case tarball. Defaults to RELEASE_SAMPLE_CASE_ARTIFACT_SHA256 repository variable."
        required: false
        type: string
      skip_sample_case_artifact:
        description: "Publish without the sample case artifact."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'schedule' && 'beta-main' || format('{0}-{1}', inputs.release_kind, inputs.target_ref) }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ${{ github.event_name == 'schedule' && 'beta' || inputs.release_kind }} release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || inputs.target_ref }}
          fetch-depth: 0

      - name: Fetch release tags
        run: git fetch --force --tags origin

      - name: Compute release tag
        id: release
        env:
          RELEASE_KIND: ${{ github.event_name == 'schedule' && 'beta' || inputs.release_kind }}
          RELEASE_DATE: ${{ github.event.inputs.date || '' }}
          RELEASE_CORRECTION: ${{ github.event.inputs.correction || '' }}
        run: ./scripts/release/compute_tag.sh

      - name: Skip when there are no new changes
        if: steps.release.outputs.should_release != 'true'
        run: |
          {
            echo "## ${{ steps.release.outputs.kind }} release skipped"
            echo
            echo "No commits found since the latest reachable release tag: \`${{ steps.release.outputs.latest_reachable_release_tag }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v6
        if: steps.release.outputs.should_release == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install Apptainer
        if: steps.release.outputs.should_release == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer --version

      - name: Download sample case artifact
        if: steps.release.outputs.should_release == 'true'
        env:
          SAMPLE_CASE_ARTIFACT_URL: ${{ github.event.inputs.sample_case_artifact_url || vars.RELEASE_SAMPLE_CASE_ARTIFACT_URL || '' }}
          SAMPLE_CASE_ARTIFACT_SHA256: ${{ github.event.inputs.sample_case_artifact_sha256 || vars.RELEASE_SAMPLE_CASE_ARTIFACT_SHA256 || '' }}
          SKIP_SAMPLE_CASE_ARTIFACT_INPUT: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.skip_sample_case_artifact || vars.SKIP_SAMPLE_CASE_ARTIFACT || 'false' }}
        run: |
          if [[ "$SKIP_SAMPLE_CASE_ARTIFACT_INPUT" == "true" ]]; then
            echo "SKIP_SAMPLE_CASE_ARTIFACT=true" >> "$GITHUB_ENV"
            exit 0
          fi

          if [[ -z "$SAMPLE_CASE_ARTIFACT_URL" ]]; then
            echo "Set RELEASE_SAMPLE_CASE_ARTIFACT_URL, pass sample_case_artifact_url, or set SKIP_SAMPLE_CASE_ARTIFACT=true." >&2
            exit 1
          fi

          sample_tarball="$RUNNER_TEMP/neurocade-sample-case-FastSurfer_Rhineland_0000.tar.gz"
          curl -fL --retry 3 --retry-delay 5 -o "$sample_tarball" "$SAMPLE_CASE_ARTIFACT_URL"
          if [[ -n "$SAMPLE_CASE_ARTIFACT_SHA256" ]]; then
            echo "$SAMPLE_CASE_ARTIFACT_SHA256  $sample_tarball" | sha256sum -c -
          fi
          tar -tzf "$sample_tarball" >/dev/null
          echo "SAMPLE_CASE_TARBALL=$sample_tarball" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        if: steps.release.outputs.should_release == 'true'
        run: npm ci
        working-directory: client

      - name: Build static client
        if: steps.release.outputs.should_release == 'true'
        run: npm run build
        working-directory: client

      - name: Build packaged artifacts
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          APPTAINER_USE_SUDO: "true"
          SKIP_CONTAINER_ARTIFACTS: "false"
        run: |
          export APPTAINER_CACHEDIR="$RUNNER_TEMP/apptainer-cache"
          export APPTAINER_TMPDIR="$RUNNER_TEMP/apptainer-tmp"
          mkdir -p "$APPTAINER_CACHEDIR" "$APPTAINER_TMPDIR"
          ./scripts/apptainer/images.sh preflight
          ./scripts/release/build_artifacts.sh

      - name: Stage release upload assets
        if: steps.release.outputs.should_release == 'true'
        run: ./scripts/release/stage_upload_assets.sh

      - name: Tag release commit
        if: steps.release.outputs.should_release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "NeuroCade $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"

      - name: Publish GitHub release
        if: steps.release.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ steps.release.outputs.kind }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            dist/release-upload/*
            --repo "$GITHUB_REPOSITORY"
            --generate-notes
          )

          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then
            args+=(--title "NeuroCade ${RELEASE_VERSION}" --prerelease --latest=false)
          else
            args+=(--title "NeuroCade ${RELEASE_VERSION}" --latest)
          fi

          gh release create "${args[@]}"

      - name: Summarize release
        if: steps.release.outputs.should_release == 'true'
        run: |
          sample_case_included=true
          if [[ "${SKIP_SAMPLE_CASE_ARTIFACT:-false}" == "true" ]]; then
            sample_case_included=false
          fi
          {
            echo "## ${{ steps.release.outputs.kind }} release published"
            echo
            echo "- Tag: \`${{ steps.release.outputs.tag }}\`"
            echo "- Commit: \`${{ steps.release.outputs.head_sha }}\`"
            echo "- Container artifacts included: bash runtime, Postgres, Redis, and Traefik SIFs"
            echo "- Sample case artifact included: \`$sample_case_included\`"
          } >> "$GITHUB_STEP_SUMMARY"
